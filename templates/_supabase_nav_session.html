<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    (function () {
        var cfgEl = document.getElementById('supabase-config');
        var guest = document.getElementById('navAuthGuest');
        var user = document.getElementById('navAuthUser');
        var logoutBtn = document.getElementById('navLogoutBtn');
        var profileBtn = document.getElementById('navProfileBtn');
        var profileMenu = document.getElementById('navProfileMenu');
        var profileEmail = document.getElementById('navProfileEmail');
        var profileWrap = document.getElementById('navProfileWrap');
        var profileUsernameForm = document.getElementById('navProfileUsernameForm');
        var profileUsernameInput = document.getElementById('navProfileUsernameInput');
        var profileUsernameStatus = document.getElementById('navProfileUsernameStatus');
        var profileUsernameSave = document.getElementById('navProfileUsernameSave');
        var profileUsernameToggle = document.getElementById('navProfileUsernameToggle');
        var profileUsernamePanel = document.getElementById('navProfileUsernamePanel');
        var profilePasswordForm = document.getElementById('navProfilePasswordForm');
        var profileCurrentPassword = document.getElementById('navProfileCurrentPassword');
        var profileNewPassword = document.getElementById('navProfileNewPassword');
        var profileConfirmPassword = document.getElementById('navProfileConfirmPassword');
        var profilePasswordStatus = document.getElementById('navProfilePasswordStatus');
        var profilePasswordSave = document.getElementById('navProfilePasswordSave');
        var profilePasswordToggle = document.getElementById('navProfilePasswordToggle');
        var profilePasswordPanel = document.getElementById('navProfilePasswordPanel');
        var heroOpenDashboardCta = document.getElementById('heroOpenDashboardCta');
        var passwordSubmitting = false;
        if (!cfgEl || !guest) return;

        function setProfileOpen(open) {
            if (!profileBtn || !profileMenu) return;
            profileBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            profileMenu.hidden = !open;
            if (!open) {
                setAccordionOpen(profileUsernameToggle, profileUsernamePanel, false);
                setAccordionOpen(profilePasswordToggle, profilePasswordPanel, false);
            }
        }

        function setAccordionOpen(toggle, panel, open) {
            if (!toggle || !panel) return;
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            panel.hidden = !open;
        }

        function setProfileUsernameStatus(msg, kind) {
            if (!profileUsernameStatus) return;
            profileUsernameStatus.textContent = msg || '';
            profileUsernameStatus.classList.remove(
                'nav-profile-username-status--error',
                'nav-profile-username-status--ok'
            );
            if (kind === 'error') profileUsernameStatus.classList.add('nav-profile-username-status--error');
            if (kind === 'ok') profileUsernameStatus.classList.add('nav-profile-username-status--ok');
        }

        function setProfilePasswordStatus(msg, kind) {
            if (!profilePasswordStatus) return;
            profilePasswordStatus.textContent = msg || '';
            profilePasswordStatus.classList.remove(
                'nav-profile-username-status--error',
                'nav-profile-username-status--ok'
            );
            if (kind === 'error') profilePasswordStatus.classList.add('nav-profile-username-status--error');
            if (kind === 'ok') profilePasswordStatus.classList.add('nav-profile-username-status--ok');
        }

        function evaluatePasswordRules(password, password2) {
            var p = password || '';
            var p2 = password2 || '';
            return {
                len: p.length >= 8,
                upper: /[A-Z]/.test(p),
                lower: /[a-z]/.test(p),
                digit: /[0-9]/.test(p),
                symbol: /[^A-Za-z0-9]/.test(p),
                match: p.length > 0 && p === p2,
            };
        }

        function allPasswordRulesMet(r) {
            return !!(r.len && r.upper && r.lower && r.digit && r.symbol && r.match);
        }

        function updateProfilePasswordUI() {
            if (!profilePasswordForm || !profilePasswordSave) return;
            var newPassword = profileNewPassword ? profileNewPassword.value : '';
            var confirmPassword = profileConfirmPassword ? profileConfirmPassword.value : '';
            var currentPassword = profileCurrentPassword ? profileCurrentPassword.value : '';
            var rules = evaluatePasswordRules(newPassword, confirmPassword);
            var ids = {
                len: 'navPwRuleLen',
                upper: 'navPwRuleUpper',
                lower: 'navPwRuleLower',
                digit: 'navPwRuleDigit',
                symbol: 'navPwRuleSymbol',
                match: 'navPwRuleMatch',
            };
            Object.keys(ids).forEach(function (key) {
                var el = document.getElementById(ids[key]);
                if (el) el.classList.toggle('is-met', !!rules[key]);
            });
            profilePasswordSave.disabled =
                passwordSubmitting || !currentPassword || !allPasswordRulesMet(rules);
        }

        async function loadProfileUsername(supabase) {
            if (!profileUsernameInput) return;
            try {
                var sessionRes = await supabase.auth.getSession();
                var token =
                    sessionRes.data &&
                    sessionRes.data.session &&
                    sessionRes.data.session.access_token;
                if (!token) return;
                var r = null;
                var data = {};
                for (var attempt = 0; attempt < 3; attempt++) {
                    r = await fetch('/api/profile', {
                        headers: { Authorization: 'Bearer ' + token },
                        credentials: 'same-origin',
                    });
                    data = await r.json().catch(function () {
                        return {};
                    });
                    if (r.ok && data.username) break;
                    if (r.status !== 404) break;
                    await new Promise(function (resolve) {
                        setTimeout(resolve, 250 * (attempt + 1));
                    });
                }
                if (!r || !r.ok) {
                    setProfileUsernameStatus((data && data.error) || (r && r.statusText) || 'Could not load username', 'error');
                    return;
                }
                if (data.username) profileUsernameInput.value = data.username;
                setProfileUsernameStatus('', null);
            } catch (err) {
                setProfileUsernameStatus(String(err.message || err), 'error');
            }
        }

        try {
            var cfg = JSON.parse(cfgEl.textContent);
            var key = cfg.publishableKey || cfg.anonKey;
            if (!cfg.url || !key) return;
            var supabase = createClient(cfg.url, key);
            function applyAuthNav(session) {
                if (session) {
                    guest.classList.add('is-hidden');
                    if (user) user.classList.remove('is-hidden');
                    if (profileWrap) profileWrap.classList.remove('is-hidden');
                    void loadProfileUsername(supabase);
                } else {
                    guest.classList.remove('is-hidden');
                    if (user) user.classList.add('is-hidden');
                    if (profileWrap) profileWrap.classList.add('is-hidden');
                    setProfileOpen(false);
                }
                if (profileEmail) {
                    var email = session && session.user && session.user.email;
                    profileEmail.textContent = email || 'Unknown account';
                }
                if (heroOpenDashboardCta) {
                    heroOpenDashboardCta.setAttribute('href', session ? '/dashboard2' : '/signup');
                }
            }
            supabase.auth.getSession().then(function (_ref) {
                applyAuthNav(_ref.data && _ref.data.session);
            });
            supabase.auth.onAuthStateChange(function (_event, session) {
                applyAuthNav(session);
            });
            if (profileBtn && profileMenu) {
                profileBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var open = profileBtn.getAttribute('aria-expanded') === 'true';
                    setProfileOpen(!open);
                });
                profileMenu.addEventListener('click', function (e) {
                    e.stopPropagation();
                });
                document.addEventListener('click', function () {
                    setProfileOpen(false);
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') setProfileOpen(false);
                });
            }
            if (profileUsernameToggle && profileUsernamePanel) {
                profileUsernameToggle.addEventListener('click', function () {
                    var open = profileUsernameToggle.getAttribute('aria-expanded') === 'true';
                    setAccordionOpen(profileUsernameToggle, profileUsernamePanel, !open);
                    if (!open) {
                        setAccordionOpen(profilePasswordToggle, profilePasswordPanel, false);
                        if (profileUsernameInput) profileUsernameInput.focus();
                    }
                });
            }
            if (profilePasswordToggle && profilePasswordPanel) {
                profilePasswordToggle.addEventListener('click', function () {
                    var open = profilePasswordToggle.getAttribute('aria-expanded') === 'true';
                    setAccordionOpen(profilePasswordToggle, profilePasswordPanel, !open);
                    if (!open) {
                        setAccordionOpen(profileUsernameToggle, profileUsernamePanel, false);
                        updateProfilePasswordUI();
                        if (profileCurrentPassword) profileCurrentPassword.focus();
                    }
                });
            }
            if (profileUsernameForm && profileUsernameInput) {
                profileUsernameForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    void (async function () {
                        if (profileUsernameSave) profileUsernameSave.disabled = true;
                        setProfileUsernameStatus('Saving…', null);
                        try {
                            var sessionRes = await supabase.auth.getSession();
                            var token =
                                sessionRes.data &&
                                sessionRes.data.session &&
                                sessionRes.data.session.access_token;
                            if (!token) throw new Error('Not signed in.');
                            var r = await fetch('/api/profile', {
                                method: 'PATCH',
                                headers: {
                                    Authorization: 'Bearer ' + token,
                                    'Content-Type': 'application/json',
                                },
                                credentials: 'same-origin',
                                body: JSON.stringify({
                                    username: profileUsernameInput.value.trim(),
                                }),
                            });
                            var data = await r.json().catch(function () {
                                return {};
                            });
                            if (!r.ok) throw new Error(data.error || r.statusText);
                            if (data.username) profileUsernameInput.value = data.username;
                            setProfileUsernameStatus('Username saved.', 'ok');
                        } catch (err) {
                            setProfileUsernameStatus(String(err.message || err), 'error');
                        } finally {
                            if (profileUsernameSave) profileUsernameSave.disabled = false;
                        }
                    })();
                });
            }
            if (profilePasswordForm) {
                ['input', 'blur', 'paste'].forEach(function (evt) {
                    if (profileCurrentPassword) {
                        profileCurrentPassword.addEventListener(evt, function () {
                            setTimeout(updateProfilePasswordUI, 0);
                        });
                    }
                    if (profileNewPassword) {
                        profileNewPassword.addEventListener(evt, function () {
                            setTimeout(updateProfilePasswordUI, 0);
                        });
                    }
                    if (profileConfirmPassword) {
                        profileConfirmPassword.addEventListener(evt, function () {
                            setTimeout(updateProfilePasswordUI, 0);
                        });
                    }
                });
                updateProfilePasswordUI();

                profilePasswordForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    void (async function () {
                        passwordSubmitting = true;
                        updateProfilePasswordUI();
                        setProfilePasswordStatus('Updating password…', null);
                        try {
                            var sessionRes = await supabase.auth.getSession();
                            var session = sessionRes.data && sessionRes.data.session;
                            var email =
                                session &&
                                session.user &&
                                session.user.email;
                            if (!session || !email) throw new Error('Not signed in.');

                            var currentPassword = profileCurrentPassword
                                ? profileCurrentPassword.value
                                : '';
                            var newPassword = profileNewPassword ? profileNewPassword.value : '';
                            var confirmPassword = profileConfirmPassword
                                ? profileConfirmPassword.value
                                : '';
                            var rules = evaluatePasswordRules(newPassword, confirmPassword);

                            if (!currentPassword) {
                                throw new Error('Enter your current password.');
                            }
                            if (!allPasswordRulesMet(rules)) {
                                throw new Error(
                                    'Use at least 8 characters with uppercase, lowercase, a number, and a symbol, and make sure both fields match.'
                                );
                            }
                            if (newPassword === currentPassword) {
                                throw new Error('Choose a password different from your current one.');
                            }

                            var reauth = await supabase.auth.signInWithPassword({
                                email: email,
                                password: currentPassword,
                            });
                            if (reauth.error) {
                                throw new Error('Current password is incorrect.');
                            }

                            var updateRes = await supabase.auth.updateUser({
                                password: newPassword,
                            });
                            if (updateRes.error) throw updateRes.error;

                            if (profilePasswordForm) profilePasswordForm.reset();
                            updateProfilePasswordUI();
                            setProfilePasswordStatus('Password updated.', 'ok');
                        } catch (err) {
                            setProfilePasswordStatus(String(err.message || err), 'error');
                        } finally {
                            passwordSubmitting = false;
                            updateProfilePasswordUI();
                        }
                    })();
                });
            }
            if (logoutBtn && user) {
                logoutBtn.addEventListener('click', function () {
                    logoutBtn.disabled = true;
                    setProfileOpen(false);
                    supabase.auth
                        .signOut()
                        .catch(function (err) {
                            console.warn('Sign out failed', err);
                        })
                        .finally(function () {
                            window.location.href = '/';
                        });
                });
            }
        } catch (e) {
            console.warn('Supabase nav session check failed', e);
        }
    })();
</script>
