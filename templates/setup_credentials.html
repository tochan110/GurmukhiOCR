<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OCR key — Gurmukhi OCR</title>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #2a2a3a 0%, #1f1f2e 50%, #2d2d3d 100%);
            --bg-card: linear-gradient(135deg, #2d2d3d 0%, #353545 100%);
            --text-primary: #e8e8e8;
            --text-secondary: rgba(200, 200, 220, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent: #5a7ab8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
        .hint { font-size: 0.85rem; opacity: 0.9; margin-top: -0.5rem; margin-bottom: 1rem; }
        input[type="file"] { display: none; }
        label.upload-btn {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #3a4a6a 0%, #2a3a5a 100%);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        label.upload-btn:hover { filter: brightness(1.08); }
        .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
        .filename { font-size: 0.85rem; color: var(--text-secondary); word-break: break-all; }
        button.primary {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }
        button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            padding: 0.5rem 1rem;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #msg { margin-top: 1rem; font-size: 0.9rem; min-height: 1.5em; }
        #msg.error { color: #f88; }
        #msg.ok { color: #8d8; }
        .actions { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
        .back-home { display: block; text-align: center; margin-bottom: 1rem; font-size: 0.9rem; }
        .back-home a { color: var(--text-secondary); text-decoration: none; }
        .back-home a:hover { color: var(--text-primary); text-decoration: underline; }
    </style>
</head>
<body>
    <p class="back-home"><a href="/">← Home</a></p>
    <div class="card">
        <h1>Google Cloud Vision (OCR) key</h1>
        <p>Upload your Google Cloud <strong>service account JSON</strong> key. It is stored only on this server for your current session and is used to call the Vision API.</p>
        <p class="hint">Create a key in Google Cloud Console → IAM → Service Accounts → Keys → Add key → JSON.</p>
        <div class="row">
            <input type="file" id="keyFile" accept=".json,application/json">
            <label for="keyFile" class="upload-btn">Choose JSON file</label>
            <span class="filename" id="fileName"></span>
        </div>
        <button type="button" class="primary" id="submitBtn" disabled>Save key</button>
        <div id="msg"></div>
        <div class="actions" id="afterOk" style="display: none;">
            <a href="/dashboard2"><button type="button" class="primary" id="goApp">Continue to dashboard</button></a>
        </div>
        <div class="actions" style="margin-top: 1rem;">
            <button type="button" class="secondary" id="removeBtn">Remove session key</button>
        </div>
    </div>
    <script>
        const keyFile = document.getElementById('keyFile');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        const afterOk = document.getElementById('afterOk');

        async function refreshStatus() {
            const r = await fetch('/api/auth/status', { credentials: 'same-origin' });
            const d = await r.json();
            if (d.has_credentials) {
                msg.textContent = 'A key is configured for this session.';
                msg.className = 'ok';
                afterOk.style.display = 'flex';
            }
        }
        refreshStatus();

        keyFile.addEventListener('change', () => {
            if (keyFile.files.length) {
                fileName.textContent = keyFile.files[0].name;
                submitBtn.disabled = false;
            } else {
                fileName.textContent = '';
                submitBtn.disabled = true;
            }
        });

        submitBtn.addEventListener('click', async () => {
            if (!keyFile.files.length) return;
            msg.textContent = 'Uploading…';
            msg.className = '';
            const fd = new FormData();
            fd.append('file', keyFile.files[0]);
            try {
                const r = await fetch('/api/credentials', { method: 'POST', body: fd, credentials: 'same-origin' });
                const d = await r.json();
                if (!r.ok) {
                    msg.textContent = d.error || 'Upload failed';
                    msg.className = 'error';
                    return;
                }
                msg.textContent = d.message || 'Saved.';
                msg.className = 'ok';
                afterOk.style.display = 'flex';
            } catch (e) {
                msg.textContent = String(e);
                msg.className = 'error';
            }
        });

        document.getElementById('removeBtn').addEventListener('click', async () => {
            msg.textContent = 'Removing…';
            msg.className = '';
            const r = await fetch('/api/credentials', { method: 'DELETE', credentials: 'same-origin' });
            const d = await r.json();
            if (r.ok) {
                msg.textContent = d.message || 'Removed.';
                msg.className = 'ok';
                afterOk.style.display = 'none';
            } else {
                msg.textContent = d.error || 'Failed';
                msg.className = 'error';
            }
        });
    </script>
</body>
</html>
